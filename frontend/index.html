<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure, production-ready user account registration">
    <title>Create Account | Secure Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Create Account</h1>
            <p class="subtitle">Join our secure platform today</p>

            <div id="statusAlert" class="status-alert" role="alert" style="display: none;"></div>

            <form id="registrationForm" novalidate>
                <!-- Full Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="John Doe"
                        required
                        autocomplete="name"
                    >
                    <span class="field-error" id="nameError"></span>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Work Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="john@example.com"
                        required
                        autocomplete="email"
                    >
                    <span class="field-error" id="emailError"></span>
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="10-digit mobile number"
                        maxlength="10"
                        required
                        autocomplete="tel"
                    >
                    <span class="field-error" id="phoneError"></span>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-button">
                        <input
                            type="password"
                            id="password"
                            placeholder="Min 8 chars, uppercase, lowercase, number"
                            required
                            autocomplete="new-password"
                        >
                        <button type="button" class="toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">Show</button>
                    </div>
                    <span class="field-error" id="passwordError"></span>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-with-button">
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Re-enter your password"
                            required
                            autocomplete="new-password"
                        >
                        <button type="button" class="toggle-btn" id="toggleConfirmPasswordBtn" aria-label="Toggle confirm password visibility">Show</button>
                    </div>
                    <span class="field-error" id="confirmPasswordError"></span>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="registerButton" class="submit-btn">
                    <span class="btn-text">Create Account</span>
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
