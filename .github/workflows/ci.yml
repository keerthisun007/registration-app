name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Maven Tests with Google Central Mirror
      working-directory: ./registration-backend
      run: ./mvnw clean test -s settings.xml

    - name: Package JAR artifact
      working-directory: ./registration-backend
      run: ./mvnw package -DskipTests -s settings.xml
