spring.application.name=registration-backend-test

# H2 In-Memory Database with MySQL compatibility mode for rapid testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Disable rate-limiting filter during automated integration tests
app.rate-limiting.enabled=false
app.cors.allowed-origins=*
