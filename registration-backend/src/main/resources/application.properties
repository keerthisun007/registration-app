# ===================================================================
# [Spring Boot Core] Application Identification
# USE: Defines the name identifier for this Spring Boot microservice.
# WHY: Appears in application logs and helps trace services in distributed environments.
# ===================================================================
spring.application.name=registration-backend

# ===================================================================
# [Apache Tomcat Web Server] Port Configuration
# USE: Specifies the HTTP network port on which the embedded Tomcat web server listens.
# WHY: Port 8080 is standard for development. When started, Tomcat binds to http://localhost:8080.
# ===================================================================
server.port=8080

# ===================================================================
# [MySQL Database & HikariCP Connection Pool] Connection Configuration
# ===================================================================

# [Optional Local Secrets Import]
# Imports local developer secrets (passwords) from application-local.properties if present on this machine.
# On production / GitHub, this file is omitted safely without errors.
spring.config.import=optional:classpath:application-local.properties

# [MySQL / JDBC URL]
# USE: JDBC connection string to communicate with the MySQL database server.
# PRODUCTION: In the cloud, ${SPRING_DATASOURCE_URL} is injected from cloud provider settings.
# LOCAL DEFAULT: Falls back to localhost:3306/registration_db if environment variable is not set.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/registration_db?useSSL=false&serverTimezone=UTC}

# [MySQL Username]
# USE: MySQL database username.
# PRODUCTION: ${SPRING_DATASOURCE_USERNAME} injected from cloud provider.
# LOCAL DEFAULT: 'root'
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

# [MySQL Password]
# USE: MySQL database password.
# PRODUCTION: Read securely from ${SPRING_DATASOURCE_PASSWORD} environment secret.
# LOCAL: Loaded from git-ignored application-local.properties.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===================================================================
# [Hibernate ORM & Spring Data JPA] Database Mapping Configuration
# ===================================================================

# [Hibernate DDL Auto]
# USE: Automatic DDL (Data Definition Language) generation strategy.
# WHY: 'update' automatically compares the User.java entity with MySQL schema on startup:
#      - If the 'users' table doesn't exist, Hibernate creates it automatically.
#      - If new columns are added, Hibernate alters the table without deleting existing user data.
spring.jpa.hibernate.ddl-auto=update

# [Hibernate SQL Logging]
# USE: Controls whether generated SQL statements are printed to the console terminal.
# WHY: 'true' allows developers to see the exact SQL queries (SELECT, INSERT) generated by Hibernate in real-time.
spring.jpa.show-sql=true

# [Spring Data JPA Performance]
# USE: Disables Spring's "Open Session In View" pattern.
# WHY: Best practice for performance; closes the database connection immediately after the service/repository layer finishes,
#      avoiding connection leaks during slow HTTP client responses.
spring.jpa.open-in-view=false