# ===================================================================
# [Spring Boot Core] Application Configuration
# ===================================================================
spring.application.name=registration-backend

# [Tomcat Port] Cloud-ready: dynamically accepts $PORT injected by Render/Heroku/AWS, defaults to 8080 locally
server.port=${PORT:8080}

# ===================================================================
# [MySQL Database Connection & HikariCP Pool]
# ===================================================================
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/registration_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# [HikariCP Connection Pool Tuning]
# Prevents resource exhaustion and manages robust connection recycling in production
spring.datasource.hikari.pool-name=RegistrationHikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===================================================================
# [Flyway Database Migrations]
# ===================================================================
# Enforces versioned database migrations, preventing schema drifts across deployments
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ===================================================================
# [Hibernate ORM / Spring Data JPA]
# ===================================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Set to 'validate' so Hibernate verifies the schema matches Flyway migrations rather than mutating it
spring.jpa.hibernate.ddl-auto=validate

# In production, show-sql must be false to avoid console pollution and PII leakage
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===================================================================
# [Spring Boot Actuator Monitoring & Health Probes]
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# ===================================================================
# [Application Security & CORS Configuration]
# ===================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173}
app.rate-limiting.enabled=true
app.rate-limiting.max-requests=10
