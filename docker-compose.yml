version: '3.8'

services:
  # ==============================================================================
  # MySQL Database Service
  # ==============================================================================
  mysql:
    image: mysql:8.0
    container_name: registration-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: registration_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==============================================================================
  # Spring Boot Backend Service
  # ==============================================================================
  backend:
    build:
      context: ./registration-backend
      dockerfile: Dockerfile
    container_name: registration-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/registration_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      CORS_ALLOWED_ORIGINS: "*"
      PORT: "8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
